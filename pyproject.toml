[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openicu-yaib"
version = "0.1.0"
description = "Convert OpenICU concept outputs to YAIB-wide tables and validate against RICU."
authors = [{ name = "OpenICU contributors" }]
license = { file = "LICENSE" }
keywords = ["OpenICU", "YAIB", "RICU", "ICU", "MIMIC-IV", "critical-care"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "jupyter>=1.0.0",
]

[project.scripts]
openicu-yaib = "openicu_yaib.cli:main"
openicu-yaib-dyn = "openicu_yaib.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
exclude = ["example/notebooks/archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []
